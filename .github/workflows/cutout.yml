# Packshot cut-outs, after every sync (Phase K, K1; DESIGN.md, "Imagery").
#
# Runs `pnpm images:cutout` (apps/scraper/src/commands-cutout.ts): every active
# product photo without a cut-out is cut out to transparency by BRIA RMBG 2.0
# on fal (given the photo's public address), checked and trimmed against the
# photo by tools/cutout/cutout.py, stored content-addressed under cutouts/ in
# the image store, and recorded in image_cutouts. A cut-out no check changed
# goes live by itself; the rest wait for the owner on /admin/snimki.
#
# Only the Node command uses FAL_KEY, and only the step that cuts has it. The
# command runs the Python tool with none of the secrets in its environment
# (cutoutEnvironment) and does every write itself; the tool runs as its child
# in the same step, though, so it is kept from the secrets, not walled off.
# fal is prepaid: with no credit it refuses every call, and the run stops
# asking, records what was already answered, and fails without spending any
# other photo's attempts; so does a run in which fal answers no photo.
#
# LOGS ARE PUBLIC (see sync.yml). The job prints content hashes and counts
# only. Never add a step that echoes the environment, runs with `set -x`, or
# prints a secret.
#
# Configuration (names only, the same as the sync's, and the model's key):
#   secrets    DATABASE_URL, BLOB_READ_WRITE_TOKEN, FAL_KEY (an API-scoped fal key)
#   variables  STORAGE_DRIVER, STORAGE_PUBLIC_BASE_URL,
#              CUTOUT_LIMIT (photos per run, default 60; the first backfill
#              of the whole catalog takes a few runs)

name: Packshot cut-outs

on:
  workflow_run:
    workflows: ["Catalog sync"]
    types: [completed]
  workflow_dispatch:
    inputs:
      limit:
        description: "Photos this run (blank for the default)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "List what would be cut, and stop"
        type: boolean
        default: false
      redo:
        description: "Re-cut these photos (content hashes, comma-separated), settled or not; each waits on /admin/snimki"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Its own group: a cut-out run writes only image_cutouts and new objects under
# cutouts/, which the sync never touches.
concurrency:
  group: catalog-cutout
  cancel-in-progress: false

jobs:
  cutout:
    name: Cut out packshots
    if: >-
      !github.event.repository.fork &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success'))
    # GitHub's standard runner, free for a public repository: the model runs
    # on fal (about 3 s a photo), and the tool's checks take about a second.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets are given only to the step that uses them, never to the job: the
    # install steps run third-party install scripts.
    env:
      NODE_VERSION: "22"
      PYTHON_VERSION: "3.13"
    steps:
      - name: Check configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          STORAGE_DRIVER: ${{ vars.STORAGE_DRIVER }}
          STORAGE_PUBLIC_BASE_URL: ${{ vars.STORAGE_PUBLIC_BASE_URL }}
          LIMIT: ${{ inputs.limit || vars.CUTOUT_LIMIT }}
          REDO: ${{ inputs.redo }}
        run: |
          missing=()
          [ -n "$DATABASE_URL" ]            || missing+=("secret DATABASE_URL")
          [ -n "$BLOB_READ_WRITE_TOKEN" ]   || missing+=("secret BLOB_READ_WRITE_TOKEN")
          [ -n "$FAL_KEY" ]                 || missing+=("secret FAL_KEY")
          [ -n "$STORAGE_DRIVER" ]          || missing+=("variable STORAGE_DRIVER")
          [ -n "$STORAGE_PUBLIC_BASE_URL" ] || missing+=("variable STORAGE_PUBLIC_BASE_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Cut-outs are not configured::Missing ${missing[*]}."
            exit 1
          fi
          if [ -n "$LIMIT" ] && ! [[ "$LIMIT" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "::error title=Bad input::limit must be a positive whole number."
            exit 1
          fi
          if [ -n "$REDO" ] && ! [[ "$REDO" =~ ^[0-9a-f]{64}(,[0-9a-f]{64}){0,49}$ ]]; then
            echo "::error title=Bad input::redo takes up to 50 photo content hashes, comma-separated."
            exit 1
          fi
          node -e '
            try {
              const u = new URL(process.env.DATABASE_URL);
              for (const v of [decodeURIComponent(u.password), u.hostname]) {
                if (v) console.log("::add-mask::" + v);
              }
            } catch {
              console.log("::error title=Cut-outs are not configured::DATABASE_URL is not a valid URL.");
              process.exit(1);
            }
          '

      - uses: actions/checkout@v4
        with:
          # No GitHub token left in .git/config for anything later to find.
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/cutout/requirements.txt

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check -r tools/cutout/requirements.txt

      - name: Test the tool
        working-directory: tools/cutout
        run: python -m unittest -v test_cutout.py

      - name: Cut out
        id: cutout
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          STORAGE_DRIVER: ${{ vars.STORAGE_DRIVER }}
          STORAGE_PUBLIC_BASE_URL: ${{ vars.STORAGE_PUBLIC_BASE_URL }}
          CUTOUT_PYTHON: python
          LIMIT: ${{ inputs.limit || vars.CUTOUT_LIMIT || '60' }}
          DRY_RUN: ${{ inputs.dry_run }}
          REDO: ${{ inputs.redo }}
        run: |
          args=(--limit "$LIMIT")
          if [ -n "$REDO" ]; then args+=(--redo "$REDO"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          set +e
          pnpm images:cutout "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/cutout.out"
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Job summary
        if: always() && steps.cutout.outcome != 'skipped'
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const file = `${process.env.RUNNER_TEMP}/cutout.out`;
          const out = fs.existsSync(file) ? fs.readFileSync(file, "utf8") : "";
          let result = null, block = null;
          for (const line of out.split(/\r?\n/)) {
            if (line === "{") block = [line];
            else if (block && line === "}") {
              block.push(line);
              try { const parsed = JSON.parse(block.join("\n")); if (parsed?.command === "images:cutout") result = parsed; } catch {}
              block = null;
            } else if (block) block.push(line);
          }
          const lines = ["### Packshot cut-outs", ""];
          if (result) {
            lines.push("| Photos | Live (auto) | Waiting on /admin/snimki | Failed (a scheduled run retries them; a redo does not) |", "| --- | --- | --- | --- |");
            lines.push(`| ${result.candidates} | ${result.auto} | ${result.pending} | ${result.failed} |`);
            if (result.stopped) {
              lines.push("", `**Stopped asking the model:** ${result.stopped}. ${result.deferred ?? 0} photos wait for the next run, with no attempt spent.`);
            }
          } else {
            lines.push("No structured result was printed. See the log of the previous step.");
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          EOF
