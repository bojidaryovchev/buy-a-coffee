# Continuous integration.
#
# Two jobs:
#
#   verify  typecheck, lint, formatting, unit tests, then — against a real
#           PostgreSQL holding the reference catalog — integration tests, the
#           originality and reference-coverage guards, and a production build.
#   e2e     the whole Playwright suite, desktop and mobile, against a
#           production build backed by the same catalog. Nothing is excluded.
#
# The catalog is `seed:reference`: the committed snapshot in reference/latest/
# (187 products, 20 brands, 8 categories, a generated image per product, our
# written copy). CI cannot crawl the source, and this is the one offline copy
# of the data the specs and the database-backed tests were written against.
# `seed:dev` (six invented products) is not used: it has none of it.
#
# "Unit" and "integration" are defined once, by file name, in vitest.shared.ts;
# `pnpm test` and `pnpm test:integration` run the two groups and this file
# runs those commands, so a test cannot be in one group locally and the other
# here.
#
# Third-party actions are pinned to a major version tag, not a commit SHA:
# the SHAs could not be verified from where this file was written. Resolve them
# (for example with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`) and pin
# before relying on this workflow as a supply-chain control.

name: CI

on:
  pull_request:
  push:
    branches: [main, completion]

# Read-only everywhere: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same pull request or branch makes the older run moot.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  # The package manager version comes from `packageManager` in package.json.
  NODE_VERSION: "22"
  # Throwaway service container; these credentials exist only for the run.
  DATABASE_URL: postgres://catalog:catalog@localhost:5432/catalog
  # The integration helper derives its own *_test database from this server.
  TEST_DATABASE_URL: postgres://catalog:catalog@localhost:5432/catalog
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:8765

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog -d catalog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # No database is configured for the unit group (see vitest.shared.ts), so
      # nothing here can pass or fail on what happens to be in PostgreSQL.
      - name: Unit tests
        run: pnpm test

      # Applies packages/db/migrations and then migrations-pending/*.sql.
      - name: Migrate database
        run: pnpm db:migrate

      # The database-backed tests that read the catalog (search synonyms, the
      # vending blends) are written against this snapshot and skip without it.
      - name: Seed database
        run: pnpm seed:reference

      # With CI set, an unreachable database fails the run instead of skipping
      # the tests (vitest.integration-setup.ts).
      - name: Integration tests
        run: pnpm test:integration

      - name: Originality check
        run: pnpm check:originality

      - name: Reference coverage
        run: pnpm reference:coverage

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (desktop and mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog -d catalog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate and seed database
        run: |
          pnpm db:migrate
          pnpm seed:reference

      - name: Build
        run: pnpm build

      # Both Playwright projects (desktop Chrome, Pixel 7) run on Chromium.
      - name: Install browser
        run: pnpm --filter @catalog/web exec playwright install --with-deps chromium

      # Every spec runs, desktop and mobile. Measured against this exact setup
      # (reference seed, production build) the whole suite passes; an earlier
      # version of this job excluded 39 specs by title because it was seeded
      # with six invented products. If a spec ever cannot pass in CI, exclude it
      # here with --grep-invert and write the reason next to the title — do not
      # shrink the seed or the assertion.
      #
      # The Playwright config supplies throwaway admin credentials to the server
      # it starts, so the admin-gate spec does not depend on the runner's env.
      - name: Run the end-to-end suite
        env:
          # CI=true makes Playwright retry twice, use two workers and write an
          # HTML report. The port is the config default.
          E2E_PORT: "8765"
        run: pnpm --filter @catalog/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
